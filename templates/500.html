{% extends "base.html" %}
{% block title %}500 - Server Error{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="saas-card p-5">
            <h1 class="display-1 text-danger fw-bold mb-3">500</h1>
            <h3 class="text-white mb-3">Internal Server Error</h3>
            <p class="text-muted mb-4">{{ error or "An unexpected server error occurred. Please check console logs." }}</p>
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-cyan">
                <i class="bi bi-arrow-left me-1"></i> Return to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
