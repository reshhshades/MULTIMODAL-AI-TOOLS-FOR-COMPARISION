{% extends "base.html" %}
{% block title %}404 - Page Not Found{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="saas-card p-5">
            <h1 class="display-1 text-info fw-bold mb-3">404</h1>
            <h3 class="text-white mb-3">Page Not Found</h3>
            <p class="text-muted mb-4">The module or resource you are looking for does not exist or may have been moved.</p>
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-cyan">
                <i class="bi bi-arrow-left me-1"></i> Return to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
